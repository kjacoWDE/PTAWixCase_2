<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINSS Clinical Reasoning</title>

<!-- fonts + styles preserved exactly -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2" rel="stylesheet">

<style>
/* --- all CSS preserved exactly from your current file --- */
:root{ --paper:#F6F7F4;--ink:#1C2A2F;--muted:#6E7B74;--line:#E2E6DF;--surface:#FFFFFF;
--teal:#2F6F6A;--teal-soft:#E8F0EC;--teal-deep:#234F4B;--alert:#C2542E;--alert-soft:#F7E9E1;
--amber:#B7791F;--amber-soft:#F6EEDD;
--shadow:0 1px 2px rgba(28,42,47,.04), 0 8px 30px rgba(28,42,47,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
line-height:1.55;-webkit-font-smoothing:antialiased;padding:clamp(16px,4vw,48px)}
.wrap{max-width:1080px;margin:0 auto}

</style>
</head>

<body>
<div class="wrap">

<!-- INTRO -->
<section id="intro">
  <div class="eyebrow"><span class="tick"></span><span id="i-kicker"></span></div>
  <h1 id="i-title"></h1>
  <p class="lede" id="i-lede"></p>
  <div class="start-row">
    <button class="btn" id="i-start" onclick="startCase()">Open the chart →</button>
    <span class="meta" id="i-meta"></span>
  </div>
</section>

<!-- SIM -->
<section id="sim" class="hidden">
  <div class="eyebrow"><span class="tick"></span><span id="s-kicker"></span></div>
  <div class="rail" id="rail"></div>
  <div class="stage">
    <div class="scene" id="scene"></div>

    <aside class="chart">
      <div class="panel">
        <h3>Patient</h3>
        <div class="pt-id">
          <div class="pt-avatar" id="pt-avatar"></div>
          <div>
            <div class="pt-name" id="pt-name"></div>
            <div class="pt-sub" id="pt-sub"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Subjective findings</h3>
        <ul class="findings" id="findings"></ul>
        <div id="findings-empty" class="empty-note">Interview the patient to gather findings.</div>
      </div>

      <div class="panel">
        <h3>SINSS readout</h3>
        <div class="sinss-read" id="sinss-read"></div>
      </div>
    </aside>
  </div>
</section>

<!-- DEBRIEF -->
<section id="debrief" class="hidden">
  <div class="eyebrow"><span class="tick"></span>Session Debrief</div>
  <div class="verdict" style="margin-top:18px">
    <h2 id="d-title"></h2>
    <div class="score-strip">
      <div class="score-item"><div id="d-sinss" class="n"></div><div class="l">SINSS correct</div></div>
      <div class="score-item"><div id="d-iv" class="n"></div><div class="l">Interventions correct</div></div>
      <div class="score-item"><div id="d-flag" class="n"></div><div class="l">Change reported</div></div>
    </div>
  </div>

  <div class="expert">
    <h3 id="e-head"></h3>
    <div id="e-body"></div>
  </div>

  <div class="start-row" style="justify-content:center">
    <button class="btn" onclick="startCase()">Run it again →</button>
    <button class="btn ghost" onclick="toIntro()">Back to start</button>
  </div>
</section>

<div class="footer" id="foot"></div>

</div>

<script>
/* =====================================================================
   SINGLE HARD‑CODED CASE — ACL Reconstruction (S2)
   ===================================================================== */

const SINSS_CASE = {
  "meta": {
    "number": "S2",
    "kicker": "PTA Clinical Reasoning · SINSS",
    "title": "Post‑op ACL Reconstruction (Right Knee) — 14 days",
    "lede": "You're the PTA carrying out an established plan of care. Read the note, interview the patient, classify SINSS, and choose interventions appropriate for today.",
    "duration": "~10 minutes · interview · classify · treat",
    "patient": { "initials": "JM", "name": "Jordan Miller", "subtitle": "27 · software developer" }
  },

  "poc": {
    "label": "Plan of Care · ACL reconstruction (hamstring autograft), 14 days post‑op",
    "dx": "Right ACL reconstruction with hamstring autograft — early post‑op phase",
    "fields": [
      { "lab": "Mechanism", "val": "Non‑contact pivot injury during soccer; ACL reconstruction 14 days ago (hamstring autograft)." },
      { "lab": "Subjective", "val": "Pain 4/10 at rest, up to 6/10 with weight bearing; difficulty with stairs; goal = return to recreational soccer." }
    ],
    "objective": [
      "AROM R knee: 0–10–65° (limited extension and flexion)",
      "AROM L knee: 0–135°",
      "PROM R knee: 0–5–75°",
      "PROM L knee: 0–140°",
      "MMT: quadriceps R 2/5 (pain/activation deficit)",
      "Sensory intact except ~3×3 cm numbness lateral to incision",
      "Antalgic gait with 2 axillary crutches (modified independent)",
      "Moderate effusion (mid‑patella girth ~3 cm > left)",
      "Palpation: medial joint line tenderness; hamstring donor site tender",
      "Hamstring length limited; patellar superior glide hypomobile"
    ],
    "stg": [
      "Knee extension to 0° and flexion to 110°",
      "Swelling reduction to <1 cm difference",
      "Independent ambulation 300 ft without pain/compensation"
    ],
    "ltg": [
      "Quadriceps strength ≥ 4+/5",
      "Jog without pain 1 mile; return to recreational soccer (~4–6 months depending on progress)"
    ],
    "plan": [
      "Therapeutic exercise: quad activation, pain‑free ROM, progressive strengthening",
      "Therapeutic activity: progress weight bearing and gait training",
      "Manual therapy: patellar mobility, soft tissue at hamstring donor site",
      "Neuromuscular reeducation: early balance & motor control",
      "Electrical stimulation: NMES to facilitate quadriceps recruitment",
      "Gait training: normalize stance and heel strike; remove crutches as able"
    ]
  },

  "interview": [
    { "dim": "Severity", "q": "On a 0–10 scale, what is your pain right now and when you're up walking or going up stairs?", "a": "About a 4 at rest, climbs to around a 6 when I try to bear weight or use stairs." },
    { "dim": "Irritability", "q": "When it flares up after activity, how long does it take to settle or calm down?", "a": "It usually stays sore for a few hours after I walk a lot — the swelling seems worse the rest of the day." },
    { "dim": "Nature", "q": "Describe the pain — is it sharp, aching, burning, numbness, or anything unusual?", "a": "Mostly a deep ache around the knee and some numbness next to the incision where the graft was taken." },
    { "dim": "Stability", "q": "Compared with last week, is your knee better, the same, or worse? Any new giving way?", "a": "It's about the same or maybe a little stiffer; no giving way but I can't fully trust it yet." },
    { "dim": "Stage", "q": "When was your surgery and how has recovery been since then?", "a": "Two weeks ago; I had expected smoother progress but it's been slower — still swollen and I need crutches." },
    { "dim": "Screen", "q": "Any new redness, increased warmth, fever, numbness spreading, or calf pain?", "a": "No fever. The area around the incision is numb, but no spreading numbness or calf pain." },
    { "dim": "Function", "q": "What activities are you able to do now and what are you avoiding?", "a": "I can get around short distances with crutches; stairs are hard and I avoid long walks or work‑outs." }
  ],

  "sinss": [
    {
      "letter": "S",
      "key": "Severity",
      "prompt": "How severe is the pain right now?",
      "options": ["Low","Moderate","High"],
      "correct": "Moderate",
      "why": "Pain 4/10 at rest and 6/10 with activity fits the moderate band."
    },
    {
      "letter": "I",
      "key": "Irritability",
      "prompt": "How irritable is the condition?",
      "options": ["Low","Moderate","High"],
      "correct": "Moderate",
      "why": "Symptoms increase with weight‑bearing and require hours to settle."
    },
    {
      "letter": "N",
      "key": "Nature",
      "prompt": "What is the nature of the problem?",
      "options": ["Nociceptive","Neuropathic","Nociplastic"],
      "correct": "Nociceptive",

    },
    {
      "letter": "S",
      "key": "Stability",

      "options": ["Improving","Same","Worsening"],

    },
    {
      "letter": "S",
      "key": "Stage",
      "prompt": "What stage is the condition?",
      "options": ["Acute","Subacute","Chronic"],
      "correct": "Acute",
      "why": "14 days post‑op = acute/early subacute transition."
    }
  ],

  "interventions": {
    "prompt": "Given his status today (moderate pain, moderate irritability, limited ROM, moderate effusion), select only the interventions appropriate for this visit.",
    "items": [
      {
        "label": "Cryotherapy and compression to control effusion and pain",
        "verdict": "perform",
        "why": "Low‑risk, reduces swelling and pain."
      },
      {
        "label": "Pain‑free active range of motion (PROM/AROM within tolerance)",
        "verdict": "perform",
        "why": "Gentle ROM prevents stiffness."
      },
      {
        "label": "Neuromuscular electrical stimulation (NMES) to the quadriceps",
        "verdict": "perform",
        "why": "Useful for early quadriceps recruitment."
      },
      {
        "label": "Gentle patellar mobilizations and soft‑tissue work",
        "verdict": "perform",
        "why": "Addresses hypomobility and donor‑site restrictions."
      },
      {
        "label": "Progressive weight‑bearing and gait training",
        "verdict": "perform",
        "why": "Improves ambulation and reduces compensations."
      },
      {
        "label": "Isolated heavy resisted open‑chain knee extension",
        "verdict": "hold",
        "why": "Too aggressive at 14 days post‑op."
      },
      {
        "label": "High‑speed eccentric / sport‑specific drills",
        "verdict": "hold",
        "why": "Premature and risks graft overload."
      }
    ]
  },

  "expert": {
    "heading": "How the reasoning fits together",
    "paragraphs": [
      "Early ACL rehabilitation balances protection of healing tissues with preventing stiffness and strength loss.",
      "Moderate irritability means low‑load, within‑tolerance interventions."
    ]
  },

  "soapKey": {
    "subjective": "Pain 4/10 at rest, 6/10 with WB; difficulty with stairs",
    "objective": "AROM R 0–10–65°; quad 2/5; moderate effusion; antalgic gait",
    "assessment": "Early post‑op ACL reconstruction with limited quad activation and ROM loss",
    "plan": "Cryotherapy, pain‑free ROM, NMES, patellar mobilization, gait training"
  }
};

/* =====================================================================
   ENGINE — unchanged from your current file
   ===================================================================== */

const PHASES = ["Plan of care","Interview","Classify (SINSS)","Interventions"];
const $ = id => document.getElementById(id);
let state;

function boot(){
  const m = SINSS_CASE.meta;
  document.title = m.title;
  const tag = `${m.kicker} · ${m.number}`;
  $("i-kicker").textContent = tag;
  $("s-kicker").textContent = tag;
  $("i-title").textContent = m.title;
  $("i-lede").textContent = m.lede;
  $("i-meta").textContent = m.duration || "";
  $("foot").textContent = "A reusable clinical-reasoning engine · Swarf ATX";
  $("pt-avatar").textContent = m.patient.initials;
  $("pt-name").textContent = m.patient.name;
  $("pt-sub").textContent = m.patient.subtitle;
}

function toIntro(){ show("intro"); scrollTop(); }
function show(w){ ["intro","sim","debrief"].forEach(s => $(s).classList.toggle("hidden", s!==w)); }
function scrollTop(){ window.scrollTo({top:0,behavior:"instant"}); }

function startCase(){
  state = { phase:0, asked:[], findings:[], sinssPicks:{}, ivPicks:new Set() };
  show("sim");
  renderRail();
  renderFindings();
  renderSinssRead();
  renderPhase();
  scrollTop();
}

function renderRail(){
  $("rail").innerHTML = "";
  PHASES.forEach((p,i) => {
    const d = document.createElement("span");
    d.className = "seg" + (i===state.phase?" on":i<state.phase?" done":"");
    d.textContent = (i+1) + " · " + p;
    $("rail").appendChild(d);
  });
}

function renderPhase(){
  renderRail();
  const s = $("scene");
  if(state.phase===0) return renderPOC(s);
  if(state.phase===1) return renderInterview(s);
  if(state.phase===2) return renderSinss(s);
  if(state.phase===3) return renderInterventions(s);
}

function renderPOC(s){
  const p = SINSS_CASE.poc;
  const obj = p.objective.map(o=>`<li>${o}</li>`).join("");
  const plan = p.plan.map(o=>`<li>${o}</li>`).join("");
  s.innerHTML = `
    <div class="phase-tag">Phase 1 · Plan of care</div>
    <div class="phase-title">Read the chart before you touch the patient</div>
    <p class="phase-sub">This plan was written by the evaluating PT. Your job today is to carry it out — but only as far as the patient's current status allows.</p>
    <div class="note">
      <div class="note-head"><span>${p.label}</span><span>Ortho</span></div>
      <div class="note-body">
        <div class="note-dx">${p.dx}</div>
        ${p.fields.map(f=>`<div class="note-row"><div class="lab">${f.lab}</div><div class="val">${f.val}</div></div>`).join("")}
        <div class="note-row"><div class="lab">Objective</div><div class="val"><ul>${obj}</ul></div></div>
        <div class="note-row"><div class="lab">Short-term goals</div><div class="val">${p.stg.join("<br>")}</div></div>
        <div class="note-row"><div class="lab">Long-term goals</div><div class="val">${p.ltg.join("<br>")}</div></div>
        <div class="note-row"><div class="lab">Treatment plan</div><div class="val"><ul>${plan}</ul></div></div>
      </div>
    </div>
    <div class="start-row"><button class="btn" onclick="next()">Interview the patient →</button></div>
  `;
